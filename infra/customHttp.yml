customHeaders:
  - pattern: '**'
    headers:
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=(self)
      - key: X-Frame-Options
        value: DENY
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
